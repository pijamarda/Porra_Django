<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Porra{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">Porra LDS</a>
      <div class="ms-auto">
        {% if user.is_authenticated %}
          <span class="text-light me-3">{{ user.username }}</span>
          <form method="post" action="/accounts/logout/" style="display:inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
          </form>
        {% else %}
          <a href="/accounts/login/" class="btn btn-outline-light btn-sm">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>

  {% if tournament %}
  <nav class="bg-light border-bottom mb-4">
    <div class="container d-flex align-items-center gap-1 py-2">
      <a href="{% url 'tournaments:index' tournament.slug %}"
         class="btn btn-sm {% if request.resolver_match.url_name == 'index' %}btn-dark{% else %}btn-outline-dark{% endif %}">
        {{ tournament.name }}
      </a>
      <span class="text-muted">|</span>
      {% for group in tournament.groups.all %}
        <a href="{% url 'tournaments:group_detail' tournament.slug group.pk %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'group_detail' and group.pk == active_group_pk %}btn-primary{% else %}btn-outline-primary{% endif %}">
          {{ group.name }}
        </a>
      {% endfor %}
      <span class="text-muted">|</span>
      <a href="{% url 'tournaments:knockout' tournament.slug %}"
         class="btn btn-sm {% if request.resolver_match.url_name == 'knockout' %}btn-success{% else %}btn-outline-success{% endif %}">
        Bracket
      </a>
      <a href="{% url 'tournaments:ranking' tournament.slug %}"
         class="btn btn-sm {% if request.resolver_match.url_name == 'ranking' %}btn-secondary{% else %}btn-outline-secondary{% endif %}">
        Ranking
      </a>
    </div>
  </nav>
  {% endif %}

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
